<!DOCTYPE html>
<html>
    <body>
        <script>
            function greet(name) {
                if (!name) {
                console.log('Hi there!');
                } 
                else {
                console.log(`Hello ${name}!`);
                }
            }
            
            greet('Sahil');
            greet('Yash');
            greet();
        </script>
    </body>
</html>
